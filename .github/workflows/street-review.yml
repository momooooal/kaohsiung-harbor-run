name: Six-route street walk
on:
  push:
    branches: [review/six-route-street-walk]
    paths: [scripts/cloud-street-review.cjs]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts
      - run: node scripts/cloud-street-review.cjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-checks
          path: review-output/
          retention-days: 1
