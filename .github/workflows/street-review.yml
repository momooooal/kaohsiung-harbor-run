name: Six-route street walk
on:
  push:
    branches: [review/six-route-street-walk]
    paths: [scripts/cloud-street-review.cjs]
permissions:
  contents: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        route: [harbor-108, harbor-5, love-21, pier-22, central-52, heart-5]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts
      - run: node scripts/cloud-street-review.cjs
        env:
          ROUTE: ${{ matrix.route }}
          CHROME_PATH: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-${{ matrix.route }}
          path: review-output/
          retention-days: 1
