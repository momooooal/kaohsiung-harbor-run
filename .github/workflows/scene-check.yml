name: Route scene checks
on:
  push:
    branches: [review/six-route-street-walk]
    paths: [scripts/scene-check.json]
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        task: ["ride-harbor-108","ride-harbor-5","ride-love-21","ride-pier-22","ride-central-52","ride-heart-5","clearance"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
      - uses: actions/checkout@v4
        with:
          ref: review/route-scenes-candidate
          path: site
      - run: npm ci --ignore-scripts
        working-directory: site
      - name: Install video encoder for route captures
        if: startsWith(matrix.task, 'ride-')
        run: |
          python3 -m pip install --target /tmp/section-media imageio-ffmpeg==0.6.0
          echo "FFMPEG=$(PYTHONPATH=/tmp/section-media python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Exercise the scene in Chrome
        working-directory: site
        env:
          TASK: ${{ matrix.task }}
          CHROME_PATH: /usr/bin/google-chrome
          TEST_OUT: ${{ github.workspace }}/proof
        run: |
          mkdir -p "$TEST_OUT"
          export TEST_URL=http://localhost:8789/
          if [ "$(node -p "JSON.parse(require('fs').readFileSync('../qa/scripts/scene-check.json','utf8').replace(/^\\uFEFF/, '')).target")" = live ]; then export TEST_URL=https://momooooal.github.io/kaohsiung-harbor-run/; fi
          if [ "$TEST_URL" = https://momooooal.github.io/kaohsiung-harbor-run/ ]; then
            for n in {1..36}; do
              curl -fsS "https://momooooal.github.io/kaohsiung-harbor-run/js/waterfront-walks.js?check=$n-$GITHUB_RUN_ID" -o /tmp/published-station.js || true
              if cmp -s js/waterfront-walks.js /tmp/published-station.js; then break; fi
              sleep 8
            done
            cmp js/waterfront-walks.js /tmp/published-station.js
            for published in js/waterfront-walks.js js/route-preview.js data/preview-clearance.js; do
              curl --retry 3 -fsS "$TEST_URL$published?check=$GITHUB_RUN_ID" -o /tmp/published-module.js
              cmp "$published" /tmp/published-module.js
            done
            echo "Testing published production files at $TEST_URL"
          fi
          python3 -m http.server 8789 --bind 127.0.0.1 >/tmp/scene-http.log 2>&1 &
          case "$TASK" in
            ride-*) node ../qa/scripts/section-film.cjs ;;
            waterproof) SCENE_SAMPLES=harbor-5-wharf,harbor-5-coral,heart-5-roadbridge node ../qa/scripts/scene-shots.cjs ;;
            water) node ../qa/scripts/inspect-water.cjs ;;
            before) TEST_URL=https://momooooal.github.io/kaohsiung-harbor-run/ node ../qa/scripts/scene-shots.cjs ;;
            visuals) node ../qa/scripts/scene-film.cjs && node ../qa/scripts/scene-shots.cjs ;;
            walk-*) node ../qa/scripts/scene-traverse.cjs ;;
            controls-*) node ../qa/scripts/scene-controls.cjs ;;
            clearance) TEST_URL=http://localhost:8789/ node scripts/compile-preview-clearance.cjs && cp data/preview-clearance.js "$TEST_OUT"/ ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.task }}
          path: proof/
          retention-days: 7
