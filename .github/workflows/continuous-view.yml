name: Walk connected Street View arrows
on:
  push:
    branches: [review/six-route-street-walk]
    paths: [scripts/continuous-view.cjs]
permissions:
  contents: read
jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        route: ["south","waterfront","north"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts
      - run: xvfb-run -a node scripts/continuous-view.cjs
        env:
          ROUTE: ${{ matrix.route }}
      - uses: actions/upload-artifact@v4
        with:
          name: arrows-${{ matrix.route }}
          path: moves/
          retention-days: 2
